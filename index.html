  async function syncToCloud() {
    try {

      showToast("Synced to Cloud");

      console.error("Sync Error:", e);
      showToast("Sync Failed!", "error");
    }
  }

  async function loadFromCloud() {
    const snap = await getDoc(DATA_REF);
    if (snap.exists()) {
      appState = snap.data();
    } else {
      console.log("No cloud data found, using local defaults.");
    }
    renderHome();
  }

        name,
        genre: document.getElementById('af-genre').value,
        bio: document.getElementById('af-bio').value

      const idx = appState.artists.findIndex(a => a.id === id);
      appState.artists[idx] = artist;
    } else {
      appState.artists.push(artist);
    }

    renderAdminContent();
  };
