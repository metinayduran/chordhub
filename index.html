<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChordHub — Guitar Chords & Lyrics</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0c0a;--bg2:#141210;--surface:#1c1917;--surface2:#242220;
  --border:#2e2b27;--border2:#3d3830;
  --ink:#f2ede6;--ink2:#c8c0b4;--muted:#6e6658;
  --accent:#e8a020;--accent2:#f0b840;
  --red:#d94f3a;--green:#4a9e6a;--blue:#3a82c4;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Crimson Pro',serif;min-height:100vh;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.5}

/* HEADER */
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 2.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;height:60px;gap:1rem}
.logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:1.3rem;letter-spacing:-.02em;cursor:pointer;color:var(--ink);flex-shrink:0}
.logo span{color:var(--accent)}
.hdr-search{display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--border2);padding:.4rem .8rem;flex:1;max-width:300px}
.hdr-search input{background:none;border:none;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:.75rem;outline:none;width:100%}
.hdr-search input::placeholder{color:var(--muted)}
.hdr-right{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.admin-btn{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;padding:.35rem .75rem;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;transition:all .15s}
.admin-btn:hover,.admin-btn.active{background:var(--accent);border-color:var(--accent);color:#000}
.breadcrumb{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.breadcrumb .bc-link{color:var(--accent);cursor:pointer}
.breadcrumb .bc-link:hover{text-decoration:underline}

/* PAGES */
.page{display:none;animation:fadeUp .35s ease both}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* HOME */
.home-hero{padding:4rem 2.5rem 2rem;border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.home-hero::before{content:'';position:absolute;right:-4rem;top:-4rem;width:300px;height:300px;background:radial-gradient(circle,rgba(232,160,32,.06),transparent 70%);pointer-events:none}
.home-hero h1{font-family:'Unbounded',sans-serif;font-size:clamp(2.4rem,6vw,5rem);font-weight:900;letter-spacing:-.03em;line-height:.92;margin-bottom:1rem}
.home-hero h1 em{color:var(--accent);font-style:normal}
.home-hero p{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.08em}
.home-sec{padding:2rem 2.5rem}
.sec-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:1.2rem;display:flex;align-items:center;gap:.75rem}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

.artists-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--border)}
.artist-card{background:var(--surface);padding:1.5rem;cursor:pointer;transition:background .15s;position:relative;overflow:hidden}
.artist-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transform-origin:bottom;transition:transform .2s}
.artist-card:hover{background:var(--surface2)}
.artist-card-name{font-family:'Unbounded',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:-.01em;margin-bottom:.3rem}
.artist-card-meta{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted)}
.genre-tag{display:inline-block;background:var(--surface2);border:1px solid var(--border2);font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:.1rem .4rem;color:var(--accent);margin-top:.5rem}

/* SONG ROWS */
.songs-list-wrap{display:flex;flex-direction:column;gap:1px;background:var(--border)}
.song-row{background:var(--surface);padding:.9rem 1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .15s;gap:1rem}
.song-row:hover{background:var(--surface2)}
.song-row-title{font-size:1rem;font-weight:600}
.key-badge{font-family:'JetBrains Mono',monospace;font-size:.65rem;background:var(--surface2);border:1px solid var(--border2);padding:.2rem .5rem;color:var(--ink2);white-space:nowrap}

/* ADMIN PANEL */
.admin-wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}
.admin-sidebar{background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 0}
.admin-nav-item{padding:.7rem 1.5rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.08em;cursor:pointer;transition:background .15s;color:var(--muted);display:flex;align-items:center;gap:.6rem;border-left:3px solid transparent}
.admin-nav-item:hover{background:var(--surface2);color:var(--ink)}
.admin-nav-item.active{background:var(--surface2);color:var(--accent);border-left-color:var(--accent)}
.admin-nav-section{padding:.5rem 1.5rem .2rem;font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-top:.5rem}
.admin-content{padding:2rem;overflow-y:auto}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.admin-title{font-family:'Unbounded',sans-serif;font-size:1.2rem;font-weight:700}
.admin-table{width:100%;border-collapse:collapse}
.admin-table th{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--border)}
.admin-table td{padding:.75rem;border-bottom:1px solid var(--border);font-size:.9rem}

/* FORM STYLES */
.form-field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.form-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.form-input{background:var(--surface2);border:1px solid var(--border2);color:var(--ink);font-family:'Crimson Pro',serif;font-size:.95rem;padding:.55rem .75rem;outline:none;width:100%}
.form-select{background:var(--surface2);border:1px solid var(--border2);color:var(--ink);padding:.55rem .75rem;width:100%}
.form-textarea.tall{min-height:300px;font-family:'JetBrains Mono',monospace;font-size:.8rem}

/* MODAL & UI */
.modal-overlay{position:fixed;inset:0;background:rgba(5,4,3,.8);z-index:300;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);width:90%;max-width:700px;max-height:90vh;overflow-y:auto}
.modal-header{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:1.5rem}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.75rem}
.btn{font-family:'JetBrains Mono',monospace;font-size:.7rem;padding:.5rem 1rem;cursor:pointer;border:1px solid}
.btn-primary{background:var(--accent);color:#000}
.btn-danger{border-color:var(--red);color:var(--red);background:none}
.btn-sm{padding:.3rem .6rem;font-size:.6rem}
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--surface);border:1px solid var(--border2);padding:.75rem 1.2rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;z-index:9000;display:none;border-left:3px solid var(--green)}
.toast.show{display:block}

/* SONG PAGE */
.lyrics-wrap{padding:2rem 2.5rem;max-width:820px;line-height:2.5}
.chord-tok{font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:700;margin-right:2px}
.lyric-tok{color:var(--ink2);font-size:1.1rem}
</style>
</head>
<body>

<header>
  <div class="logo" id="logo-btn">Chord<span>Hub</span></div>
  <div class="hdr-search"><input type="text" placeholder="Search..."></div>
  <div class="hdr-right">
    <div class="breadcrumb" id="breadcrumb"></div>
    <button class="admin-btn" id="admin-toggle-btn">⚙ Admin</button>
  </div>
</header>

<div class="page active" id="page-home"></div>
<div class="page" id="page-artist"></div>
<div class="page" id="page-song"></div>

<div class="page" id="page-admin">
  <div class="admin-wrap">
    <div class="admin-sidebar" id="admin-sidebar">
      <div class="admin-nav-item active" data-panel="artists">♪ Artists</div>
      <div class="admin-nav-item" data-panel="songs">♫ Songs</div>
    </div>
    <div class="admin-content" id="admin-content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h2 id="modal-title"></h2><button onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCfzB82jnqVCYbm8TfBjNB5mxfW4gU60JY",
    authDomain: "chordhub-d45cf.firebaseapp.com",
    projectId: "chordhub-d45cf",
    storageBucket: "chordhub-d45cf.firebasestorage.app",
    messagingSenderId: "854567914921",
    appId: "1:854567914921:web:7fc7c362ba03349ca488b8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const DATA_REF = doc(db, "chordbook", "appState");

  let STATE = { artists: [], songs: [], settings: { siteName: 'ChordHub' } };

  async function sync() { await setDoc(DATA_REF, STATE); showToast("Synced ✓"); }
  async function load() {
    const snap = await getDoc(DATA_REF);
    if(snap.exists()) STATE = snap.data();
    renderHome();
  }

  // UI RENDERING
  window.goHome = () => { renderHome(); showPage('home'); };
  function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById('page-'+id).classList.add('active'); }

  function renderHome() {
    const artists = STATE.artists.map(a => `<div class="artist-card" onclick="goArtist('${a.id}')"><div class="artist-card-name">${a.name}</div><div class="genre-tag">${a.genre || ''}</div></div>`).join('');
    const songs = STATE.songs.slice().reverse().map(s => `<div class="song-row" onclick="goSong('${s.id}')"><span>${s.title}</span><span class="key-badge">${s.key}</span></div>`).join('');
    document.getElementById('page-home').innerHTML = `<div class="home-hero"><h1>${STATE.settings.siteName}</h1></div><div class="home-sec"><div class="sec-label">Artists</div><div class="artists-grid">${artists}</div></div><div class="home-sec"><div class="sec-label">Recent</div><div class="songs-list-wrap">${songs}</div></div>`;
  }

  window.goArtist = (id) => {
    const a = STATE.artists.find(x=>x.id===id);
    const s = STATE.songs.filter(x=>x.artistId===id).map(x=>`<div class="song-row" onclick="goSong('${x.id}')">${x.title}</div>`).join('');
    document.getElementById('page-artist').innerHTML = `<div style="padding:2.5rem"><h2>${a.name}</h2><p>${a.bio || ''}</p><br>${s}</div>`;
    showPage('artist');
  };

  window.goSong = (id) => {
    const s = STATE.songs.find(x=>x.id===id);
    document.getElementById('page-song').innerHTML = `<div style="padding:2.5rem"><h2>${s.title}</h2><div class="lyrics-wrap">${parseLyrics(s.lyrics)}</div></div>`;
    showPage('song');
  };

  function parseLyrics(raw) {
    return raw.split('\n').map(line => {
      const parts = line.split(/(\[[^\]]+\])/);
      return `<div>${parts.map(p => p.startsWith('[') ? `<span class="chord-tok">${p.slice(1,-1)}</span>` : `<span class="lyric-tok">${p}</span>`).join('')}</div>`;
    }).join('');
  }

  // ADMIN LOGIC
  let activePanel = 'artists';
  document.getElementById('admin-toggle-btn').onclick = () => { renderAdmin(); showPage('admin'); };
  document.getElementById('admin-sidebar').onclick = (e) => { if(e.target.dataset.panel) { activePanel = e.target.dataset.panel; renderAdmin(); } };

  function renderAdmin() {
    const content = document.getElementById('admin-content');
    if(activePanel === 'artists') {
      const rows = STATE.artists.map(a => `<tr><td>${a.name}</td><td><button class="btn btn-sm" onclick="editArtist('${a.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteArtist('${a.id}')">Delete</button></td></tr>`).join('');
      content.innerHTML = `<div class="admin-header"><h3>Artists</h3><button class="btn btn-primary" onclick="addArtist()">+ Add</button></div><table class="admin-table"><thead><tr><th>Name</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>`;
    } else {
      const rows = STATE.songs.map(s => `<tr><td>${s.title}</td><td><button class="btn btn-sm" onclick="editSong('${s.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteSong('${s.id}')">Delete</button></td></tr>`).join('');
      content.innerHTML = `<div class="admin-header"><h3>Songs</h3><button class="btn btn-primary" onclick="addSong()">+ Add</button></div><table class="admin-table"><thead><tr><th>Title</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
  }

  // ARTIST FORMS
  window.addArtist = () => {
    openModal('Add Artist', `
      <div class="form-field"><label class="form-label">Name</label><input class="form-input" id="af-name"></div>
      <div class="form-field"><label class="form-label">Genre</label><input class="form-input" id="af-genre"></div>
      <div class="form-field"><label class="form-label">Bio</label><textarea class="form-input" id="af-bio"></textarea></div>
    `, `<button class="btn btn-primary" onclick="saveArtist()">Save</button>`);
  };

  window.editArtist = (id) => {
    const a = STATE.artists.find(x=>x.id===id);
    openModal('Edit Artist', `
      <div class="form-field"><label class="form-label">Name</label><input class="form-input" id="af-name" value="${a.name}"></div>
      <div class="form-field"><label class="form-label">Genre</label><input class="form-input" id="af-genre" value="${a.genre||''}"></div>
      <div class="form-field"><label class="form-label">Bio</label><textarea class="form-input" id="af-bio">${a.bio||''}</textarea></div>
    `, `<button class="btn btn-primary" onclick="saveArtist('${id}')">Update</button>`);
  };

  window.saveArtist = async (id='') => {
    const data = { id: id || Date.now().toString(), name: document.getElementById('af-name').value, genre: document.getElementById('af-genre').value, bio: document.getElementById('af-bio').value };
    if(id) STATE.artists = STATE.artists.map(a => a.id === id ? data : a);
    else STATE.artists.push(data);
    await sync(); closeModal(); renderAdmin();
  };

  window.deleteArtist = async (id) => { if(confirm('Delete?')) { STATE.artists = STATE.artists.filter(a=>a.id!==id); await sync(); renderAdmin(); } };

  // SONG FORMS (Vertical layout restored with Key/Difficulty/Edit)
  window.addSong = () => { openModal('Add Song', songFormHtml({}), `<button class="btn btn-primary" onclick="saveSong()">Save</button>`); };

  window.editSong = (id) => {
    const s = STATE.songs.find(x=>x.id===id);
    openModal('Edit Song', songFormHtml(s), `<button class="btn btn-primary" onclick="saveSong('${id}')">Update</button>`);
  };

  function songFormHtml(s) {
    const artistOpts = STATE.artists.map(a => `<option value="${a.id}" ${s.artistId===a.id?'selected':''}>${a.name}</option>`).join('');
    return `
      <div class="form-field"><label class="form-label">Title</label><input class="form-input" id="sf-title" value="${s.title||''}"></div>
      <div class="form-field"><label class="form-label">Artist</label><select class="form-select" id="sf-artist">${artistOpts}</select></div>
      <div style="display:flex; gap:1rem">
        <div class="form-field" style="flex:1"><label class="form-label">Key</label><input class="form-input" id="sf-key" value="${s.key||'C'}"></div>
        <div class="form-field" style="flex:1"><label class="form-label">Difficulty</label>
          <select class="form-select" id="sf-diff"><option value="easy" ${s.difficulty==='easy'?'selected':''}>Easy</option><option value="medium" ${s.difficulty==='medium'?'selected':''}>Medium</option></select>
        </div>
      </div>
      <div class="form-field"><label class="form-label">Chords (CSV)</label><input class="form-input" id="sf-chords" value="${s.chords||''}"></div>
      <div class="form-field"><label class="form-label">Lyrics</label><textarea class="form-input tall" id="sf-lyrics">${s.lyrics||''}</textarea></div>
    `;
  }

  window.saveSong = async (id='') => {
    const data = {
      id: id || Date.now().toString(),
      title: document.getElementById('sf-title').value,
      artistId: document.getElementById('sf-artist').value,
      key: document.getElementById('sf-key').value,
      difficulty: document.getElementById('sf-diff').value,
      chords: document.getElementById('sf-chords').value,
      lyrics: document.getElementById('sf-lyrics').value
    };
    if(id) STATE.songs = STATE.songs.map(x => x.id === id ? data : x);
    else STATE.songs.push(data);
    await sync(); closeModal(); renderAdmin();
  };

  window.deleteSong = async (id) => { if(confirm('Delete?')) { STATE.songs = STATE.songs.filter(x=>x.id!==id); await sync(); renderAdmin(); } };

  window.closeModal = () => document.getElementById('modal-overlay').classList.remove('open');
  function openModal(t, b, f) { document.getElementById('modal-title').innerText = t; document.getElementById('modal-body').innerHTML = b; document.getElementById('modal-footer').innerHTML = f; document.getElementById('modal-overlay').classList.add('open'); }
  function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }

  load();
  document.getElementById('logo-btn').onclick = goHome;
</script>
</body>
</html>
