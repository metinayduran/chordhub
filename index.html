<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChordHub — Guitar Chords & Lyrics</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0c0a;--bg2:#141210;--surface:#1c1917;--surface2:#242220;
  --border:#2e2b27;--border2:#3d3830;
  --ink:#f2ede6;--ink2:#c8c0b4;--muted:#6e6658;
  --accent:#e8a020;--accent2:#f0b840;
  --red:#d94f3a;--green:#4a9e6a;--blue:#3a82c4;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Crimson Pro',serif;min-height:100vh;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.5}

/* HEADER */
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 2.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;height:60px;gap:1rem}
.logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:1.3rem;letter-spacing:-.02em;cursor:pointer;color:var(--ink);flex-shrink:0}
.logo span{color:var(--accent)}
.hdr-search{display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--border2);padding:.4rem .8rem;flex:1;max-width:300px}
.hdr-search input{background:none;border:none;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:.75rem;outline:none;width:100%}
.hdr-search input::placeholder{color:var(--muted)}
.hdr-right{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.admin-btn{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;padding:.35rem .75rem;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;transition:all .15s}
.admin-btn:hover,.admin-btn.active{background:var(--accent);border-color:var(--accent);color:#000}
.breadcrumb{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.breadcrumb .bc-link{color:var(--accent);cursor:pointer}
.breadcrumb .bc-link:hover{text-decoration:underline}

/* PAGES */
.page{display:none;animation:fadeUp .35s ease both}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* HOME */
.home-hero{padding:4rem 2.5rem 2rem;border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.home-hero::before{content:'';position:absolute;right:-4rem;top:-4rem;width:300px;height:300px;background:radial-gradient(circle,rgba(232,160,32,.06),transparent 70%);pointer-events:none}
.home-hero h1{font-family:'Unbounded',sans-serif;font-size:clamp(2.4rem,6vw,5rem);font-weight:900;letter-spacing:-.03em;line-height:.92;margin-bottom:1rem}
.home-hero h1 em{color:var(--accent);font-style:normal}
.home-hero p{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.08em}
.home-sec{padding:2rem 2.5rem}
.sec-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:1.2rem;display:flex;align-items:center;gap:.75rem}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

.artists-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--border)}
.artist-card{background:var(--surface);padding:1.5rem;cursor:pointer;transition:background .15s;position:relative;overflow:hidden}
.artist-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transform-origin:bottom;transition:transform .2s}
.artist-card:hover{background:var(--surface2)}
.artist-card:hover::before{transform:scaleY(1)}
.artist-card-name{font-family:'Unbounded',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:-.01em;margin-bottom:.3rem}
.artist-card-meta{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted)}
.genre-tag{display:inline-block;background:var(--surface2);border:1px solid var(--border2);font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:.1rem .4rem;color:var(--accent);margin-top:.5rem}
.empty-state{padding:3rem;text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.8rem;letter-spacing:.08em;border:1px dashed var(--border);background:var(--surface)}

/* SONG ROWS */
.songs-list-wrap{display:flex;flex-direction:column;gap:1px;background:var(--border)}
.song-row{background:var(--surface);padding:.9rem 1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .15s;gap:1rem}
.song-row:hover{background:var(--surface2)}
.song-row-title{font-size:1rem;font-weight:600}
.song-row-artist{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted)}
.key-badge{font-family:'JetBrains Mono',monospace;font-size:.65rem;background:var(--surface2);border:1px solid var(--border2);padding:.2rem .5rem;color:var(--ink2);white-space:nowrap}
.diff-badge{font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:.15rem .5rem;border:1px solid;white-space:nowrap}
.diff-easy{color:var(--green);border-color:var(--green)}
.diff-medium{color:var(--accent);border-color:var(--accent)}
.diff-hard{color:var(--red);border-color:var(--red)}

/* ARTIST PAGE */
.artist-hero{background:var(--surface);border-bottom:1px solid var(--border);padding:3rem 2.5rem 2rem;position:relative;overflow:hidden}
.artist-hero::before{content:'';position:absolute;right:-2rem;top:-2rem;width:200px;height:200px;background:radial-gradient(circle,rgba(232,160,32,.08),transparent 70%);pointer-events:none}
.artist-hero-name{font-family:'Unbounded',sans-serif;font-size:clamp(2rem,5vw,4rem);font-weight:900;letter-spacing:-.03em;line-height:.95;margin-bottom:.5rem}
.artist-hero-genre{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
.artist-hero-bio{color:var(--ink2);max-width:600px;font-size:1rem;line-height:1.6;font-style:italic}
.artist-stats{display:flex;gap:2rem;margin-top:1.5rem}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:1.4rem;color:var(--accent)}
.stat-lbl{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

.full-song-row{border-bottom:1px solid var(--border);padding:1rem 0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:1rem;transition:padding .15s}
.full-song-row:hover{padding-left:.5rem}
.row-num{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);width:1.5rem;text-align:right;flex-shrink:0}
.row-chord-preview{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:.15rem}

/* SONG PAGE */
.song-header{background:var(--surface);border-bottom:1px solid var(--border);padding:2rem 2.5rem}
.song-header-artist{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);cursor:pointer;margin-bottom:.3rem}
.song-header-artist:hover{text-decoration:underline}
.song-header-title{font-family:'Unbounded',sans-serif;font-size:clamp(1.8rem,4vw,3.2rem);font-weight:900;letter-spacing:-.03em;margin-bottom:.6rem}
.meta-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.meta-pill{font-family:'JetBrains Mono',monospace;font-size:.65rem;background:var(--surface2);border:1px solid var(--border2);padding:.25rem .6rem;color:var(--ink2)}

.song-toolbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.75rem 2.5rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;position:sticky;top:60px;z-index:100}
.toolbar-lbl{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.transpose-wrap{display:flex;align-items:center;gap:.5rem}
.t-btn{background:var(--surface);border:1px solid var(--border2);color:var(--ink);width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:all .15s;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.t-btn:hover{background:var(--accent);border-color:var(--accent);color:#000}
.t-display{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--accent);min-width:3.5rem;text-align:center;background:var(--surface);border:1px solid var(--border2);padding:.2rem .5rem;white-space:nowrap}
.t-reset{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:.2rem .5rem;border:1px solid var(--border);background:none;transition:color .15s}
.t-reset:hover{color:var(--ink)}

.chord-legend{padding:1.2rem 2.5rem;border-bottom:1px solid var(--border);display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end}
.legend-lbl{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-right:.5rem;margin-bottom:.3rem}
.legend-chord{cursor:pointer;transition:transform .15s;position:relative}
.legend-chord:hover{transform:translateY(-2px)}
.legend-chord-name{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--accent2);text-align:center;margin-top:.2rem}

.lyrics-wrap{padding:2rem 2.5rem;max-width:820px}
.sec-heading{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.75rem;margin-top:2rem}
.sec-heading:first-child{margin-top:0}
.lyrics-line{display:flex;flex-wrap:wrap;margin-bottom:.1rem;line-height:2.5}
.cl-pair{display:inline-flex;flex-direction:column;margin-right:.04em}
.chord-tok{font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:500;color:var(--accent2);cursor:pointer;white-space:nowrap;line-height:1.4;padding:0 .1em;position:relative}
.chord-tok:hover{color:var(--accent)}
.lyric-tok{font-size:1.1rem;line-height:1.6;white-space:pre;color:var(--ink2)}

/* CHORD POPUP */
.chord-popup{position:fixed;background:var(--surface);border:1.5px solid var(--border2);padding:.8rem 1rem;z-index:500;box-shadow:0 12px 40px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;transform:translateY(-4px);min-width:120px}
.chord-popup.show{opacity:1;transform:translateY(0)}
.popup-chord-name{font-family:'Unbounded',sans-serif;font-size:.85rem;font-weight:700;color:var(--accent);margin-bottom:.3rem}

/* SEARCH */
.search-wrap{padding:2rem 2.5rem}
.search-title{font-family:'Unbounded',sans-serif;font-size:1.2rem;margin-bottom:1.5rem}
.search-title span{color:var(--accent)}
.result-item{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.2rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s}
.result-item:hover{background:var(--surface2)}
.result-tag{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .5rem;border:1px solid}
.rt-song{color:var(--accent);border-color:var(--accent)}
.rt-artist{color:var(--green);border-color:var(--green)}

/* ══ ADMIN PANEL ══ */
.admin-wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}
.admin-sidebar{background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 0}
.admin-nav-item{padding:.7rem 1.5rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.08em;cursor:pointer;transition:background .15s;color:var(--muted);display:flex;align-items:center;gap:.6rem;border-left:3px solid transparent}
.admin-nav-item:hover{background:var(--surface2);color:var(--ink)}
.admin-nav-item.active{background:var(--surface2);color:var(--accent);border-left-color:var(--accent)}
.admin-nav-section{padding:.5rem 1.5rem .2rem;font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-top:.5rem}
.admin-content{padding:2rem;overflow-y:auto}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.admin-title{font-family:'Unbounded',sans-serif;font-size:1.2rem;font-weight:700}
.btn{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.08em;padding:.5rem 1rem;cursor:pointer;transition:all .15s;border:1px solid}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#000}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-secondary{background:none;border-color:var(--border2);color:var(--ink2)}
.btn-secondary:hover{border-color:var(--ink);color:var(--ink)}
.btn-danger{background:none;border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:.3rem .6rem;font-size:.6rem}

/* Admin table */
.admin-table{width:100%;border-collapse:collapse}
.admin-table th{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.admin-table td{padding:.75rem;border-bottom:1px solid var(--border);font-size:.9rem;vertical-align:middle}
.admin-table tr:hover td{background:var(--surface2)}
.admin-table .actions{display:flex;gap:.4rem}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.form-grid.full{grid-template-columns:1fr}
.form-field{display:flex;flex-direction:column;gap:.35rem}
.form-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.form-input{background:var(--surface2);border:1px solid var(--border2);color:var(--ink);font-family:'Crimson Pro',serif;font-size:.95rem;padding:.55rem .75rem;outline:none;transition:border-color .15s;width:100%}
.form-input:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:120px;font-family:'JetBrains Mono',monospace;font-size:.75rem;line-height:1.6}
.form-textarea.tall{min-height:300px}
.form-hint{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);line-height:1.5}
.form-select{background:var(--surface2);border:1px solid var(--border2);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:.75rem;padding:.55rem .75rem;outline:none;appearance:none;cursor:pointer;transition:border-color .15s;width:100%}
.form-select:focus{border-color:var(--accent)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(5,4,3,.8);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(3px)}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border2);width:90%;max-width:700px;max-height:90vh;overflow-y:auto;transform:translateY(20px);transition:transform .25s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-header h2{font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;transition:color .15s;line-height:1}
.modal-close:hover{color:var(--red)}
.modal-body{padding:1.5rem}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.75rem;background:var(--surface);position:sticky;bottom:0}

/* Toast */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--surface);border:1px solid var(--border2);padding:.75rem 1.2rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;z-index:9000;transform:translateY(20px);opacity:0;transition:all .25s;border-left:3px solid var(--green)}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{border-left-color:var(--red)}

/* BACK BTN */
.back-btn{display:inline-flex;align-items:center;gap:.4rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.08em;color:var(--muted);cursor:pointer;padding:.4rem 0;transition:color .15s;background:none;border:none;text-transform:uppercase}
.back-btn:hover{color:var(--ink)}

/* Responsive */
@media(max-width:700px){
  header{padding:0 1rem}
  .hdr-search{max-width:140px}
  .home-hero,.home-sec,.artist-hero,.song-header,.lyrics-wrap,.chord-legend,.search-wrap{padding-left:1rem;padding-right:1rem}
  .song-toolbar{padding:.6rem 1rem;top:60px;gap:1rem}
  .admin-wrap{grid-template-columns:1fr}
  .admin-sidebar{display:flex;overflow-x:auto;padding:.5rem;border-right:none;border-bottom:1px solid var(--border)}
  .admin-nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent}
  .admin-nav-item.active{border-left:none;border-bottom-color:var(--accent)}
  .admin-content{padding:1rem}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="logo" id="logo-btn">Chord<span>Hub</span></div>
  <div class="hdr-search">
    <span style="color:var(--muted);font-size:.9rem">⌕</span>
    <input type="text" id="global-search" placeholder="Search songs or artists…">
  </div>
  <div class="hdr-right">
    <div class="breadcrumb" id="breadcrumb"></div>
    <button class="admin-btn" id="admin-toggle-btn">⚙ Admin</button>
  </div>
</header>

<!-- PUBLIC PAGES -->
<div class="page active" id="page-home"></div>
<div class="page" id="page-artist"></div>
<div class="page" id="page-song"></div>
<div class="page" id="page-search"></div>

<!-- ADMIN PAGE -->
<div class="page" id="page-admin">
  <div class="admin-wrap">
    <div class="admin-sidebar" id="admin-sidebar">
      <div class="admin-nav-section">Content</div>
      <div class="admin-nav-item active" data-panel="artists">♪ Artists</div>
      <div class="admin-nav-item" data-panel="songs">♫ Songs</div>
      <div class="admin-nav-section">Site</div>
      <div class="admin-nav-item" data-panel="settings">◈ Settings</div>
    </div>
    <div class="admin-content" id="admin-content"></div>
  </div>
</div>

<!-- CHORD POPUP -->
<div class="chord-popup" id="chord-popup">
  <div class="popup-chord-name" id="popup-name"></div>
  <div id="popup-diagram"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="modal-close" id="modal-close-btn">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
//  STORAGE
// ══════════════════════════════════════════════════════════════
const STORAGE_KEY_ARTISTS = 'chordhub_artists';
const STORAGE_KEY_SONGS   = 'chordhub_songs';
const STORAGE_KEY_SETTINGS = 'chordhub_settings';

const DEFAULT_SETTINGS = { siteName: 'ChordHub', tagline: 'Guitar Chords & Lyrics' };

const SEED_ARTISTS = [
  {id:'oasis',name:'Oasis',genre:'Britpop / Rock',bio:'Formed in Manchester in 1991, Oasis became one of the most iconic bands of the 90s Britpop era, known for anthemic songwriting and the legendary Gallagher brothers.'},
  {id:'nirvana',name:'Nirvana',genre:'Grunge / Alternative',bio:"The Seattle trio that defined 90s grunge. Kurt Cobain's raw songwriting combined with Novoselic and Grohl's rhythm section changed rock forever."},
  {id:'beatles',name:'The Beatles',genre:'Rock / Pop',bio:'The Fab Four from Liverpool changed everything. Their catalogue spans every genre and mood, making them the ultimate learning resource for any guitarist.'},
];

const SEED_SONGS = [
  {id:'wonderwall',artistId:'oasis',title:'Wonderwall',key:'F#m',capo:2,difficulty:'easy',chords:'Em7,G,Dsus4,A7sus4,Cadd9',

function drawChordSvg(name, w=100, h=110) {
  const ch = CHORD_DB[name];
  if (!ch) return `<svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg"><text x="${w/2}" y="${h/2+4}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" fill="#6e6658">${esc(name)}</text></svg>`;
  const S=6,F=5,mL=18,mT=22,sG=13,fG=15,dR=5.5,fs=7;
  const gW=sG*(S-1);
  const pf=ch.frets.filter(f=>f>0);
  let sf=pf.length?Math.min(...pf):1;
  if(ch.barre)sf=ch.barre.fret;
  if(sf<=2)sf=1;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
  if(sf===1) s+=`<rect x="${mL}" y="${mT-4}" width="${gW}" height="4" fill="#f2ede6" rx="1"/>`;
  else s+=`<text x="${mL-2}" y="${mT+fG*.6}" font-family="JetBrains Mono,monospace" font-size="${fs-1}" fill="#6e6658" text-anchor="end">${sf}</text>`;
  for(let f=0;f<=F;f++) s+=`<line x1="${mL}" y1="${mT+f*fG}" x2="${mL+gW}" y2="${mT+f*fG}" stroke="#3d3830" stroke-width="1"/>`;
  for(let i=0;i<S;i++) s+=`<line x1="${mL+i*sG}" y1="${mT}" x2="${mL+i*sG}" y2="${mT+F*fG}" stroke="#3d3830" stroke-width="1.2"/>`;
  if(ch.barre){const bf=ch.barre.fret-sf+1,bx1=mL+ch.barre.from*sG,bx2=mL+ch.barre.to*sG,by=mT+(bf-.5)*fG;s+=`<line x1="${bx1}" y1="${by}" x2="${bx2}" y2="${by}" stroke="#f2ede6" stroke-width="${dR*1.9}" stroke-linecap="round"/>`;}
  ch.frets.forEach((fret,i)=>{const x=mL+i*sG;
    if(fret===-1) s+=`<text x="${x}" y="${mT-10}" text-anchor="middle" font-size="${fs+1}" fill="#d94f3a" font-family="sans-serif">✕</text>`;
    else if(fret===0) s+=`<circle cx="${x}" cy="${mT-10}" r="${dR-2}" fill="none" stroke="#f2ede6" stroke-width="1.5"/>`;
    else{const rel=fret-sf+1;if(rel>=1&&rel<=F){const y=mT+(rel-.5)*fG;s+=`<circle cx="${x}" cy="${y}" r="${dR}" fill="#f2ede6"/>`;}}
  });
  return s+'</svg>';
}

// ══════════════════════════════════════════════════════════════
//  TRANSPOSE
// ══════════════════════════════════════════════════════════════
const CHR=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ENH={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};
function shiftNote(n,s){const nn=ENH[n]||n;const i=CHR.indexOf(nn);if(i<0)return n;return CHR[((i+s)%12+12)%12];}
function transposeChord(c,s){if(s===0)return c;const m=c.match(/^([A-G][#b]?)(.*?)(?:\/([A-G][#b]?))?$/);if(!m)return c;const[,r,q,b]=m;return shiftNote(r,s)+q+(b?'/'+shiftNote(b,s):'');}

// ══════════════════════════════════════════════════════════════
//  LYRICS PARSER
// ══════════════════════════════════════════════════════════════
function parseLyrics(raw, semitones=0) {
  const lines = raw.trim().split('\n');
  let html = '';
  lines.forEach(line => {
    const sm = line.match(/^\[([A-Z][A-Z0-9\s]*)\]$/);
    if (sm) { html += `<div class="sec-heading">${esc(sm[1])}</div>`; return; }
    if (!line.trim()) { html += '<div style="height:.4rem"></div>'; return; }
    const parts = line.split(/(\[[^\]]+\])/);
    let lh = '<div class="lyrics-line">';
    let i = 0;
    while (i < parts.length) {
      const cm = parts[i].match(/^\[([^\]]+)\]$/);
      if (cm) {
        const tc = transposeChord(cm[1], semitones);
        const ly = parts[i+1] !== undefined ? parts[i+1] : '';
        lh += `<span class="cl-pair"><span class="chord-tok" onmouseenter="showPopup(event,'${esc(tc)}')" onmouseleave="hidePopup()">${esc(tc)}</span><span class="lyric-tok">${esc(ly)}</span></span>`;
        i += 2;
      } else {
        if (parts[i]) lh += `<span class="lyric-tok">${esc(parts[i])}</span>`;
        i++;
      }
    }
    html += lh + '</div>';
  });
  return html;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ══════════════════════════════════════════════════════════════
//  SONG PAGE
// ══════════════════════════════════════════════════════════════
function goSong(id) {
  activeSongId = id;
  transposeSteps = 0;
  renderSongPage();
  showPage('song');
}

function renderSongPage() {
  const song = getSongs().find(s=>s.id===activeSongId);
  if (!song) return goHome();
  const artist = getArtists().find(a=>a.id===song.artistId);
  const transKey = transposeChord(song.key||'C', transposeSteps);
  const chordList = (song.chords||'').split(',').map(c=>c.trim()).filter(Boolean);
  const transChords = chordList.map(c=>transposeChord(c, transposeSteps));
  const label = transposeSteps===0 ? `${song.key} (orig)` : `${transKey} (${transposeSteps>0?'+':''}${transposeSteps})`;

  setBreadcrumb([
    {label:'Home',fn:'goHome()'},
    {label:artist?.name||'Artist',fn:`goArtist('${esc(song.artistId)}')`},
    {label:song.title}
  ]);

  const diagrams = transChords.map(c =>
    `<div class="legend-chord" onmouseenter="showPopup(event,'${esc(c)}')" onmouseleave="hidePopup()">
      ${drawChordSvg(c,90,100)}
      <div class="legend-chord-name">${esc(c)}</div>
    </div>`).join('');

  const lyricsHtml = song.lyrics ? parseLyrics(song.lyrics, transposeSteps) : '<p style="color:var(--muted);font-style:italic">No lyrics added yet.</p>';

  document.getElementById('page-song').innerHTML = `
    <div class="song-header">
      <div class="song-header-artist" onclick="goArtist('${esc(song.artistId)}')">${esc(artist?.name||'Unknown')} ↗</div>
      <div class="song-header-title">${esc(song.title)}</div>
      <div class="meta-row">
        <span class="meta-pill">Key: ${esc(transKey)}</span>
        ${song.capo?`<span class="meta-pill">Capo ${song.capo}</span>`:''}
        <span class="meta-pill diff-${song.difficulty||'easy'}" style="border:none">${song.difficulty||'easy'}</span>
        <span class="meta-pill">${chordList.length} chords</span>
      </div>
    </div>
    <div class="song-toolbar">
      <span class="toolbar-lbl">Transpose</span>
      <div class="transpose-wrap">
        <button class="t-btn" onclick="doTranspose(-1)">−</button>
        <div class="t-display">${esc(label)}</div>
        <button class="t-btn" onclick="doTranspose(1)">+</button>
        <button class="t-reset" onclick="resetTranspose()">Reset</button>
      </div>
    </div>
    <div class="chord-legend">
      <span class="legend-lbl">Chords</span>
      ${diagrams}
    </div>
    <div class="lyrics-wrap">${lyricsHtml}</div>`;
}

function doTranspose(d) {
  transposeSteps = Math.max(-12, Math.min(12, transposeSteps + d));
  renderSongPage();
}
function resetTranspose() { transposeSteps = 0; renderSongPage(); }

  clearTimeout(searchDebounce);

function renderSearch(q) {
  const ql = q.toLowerCase();
  const artists = getArtists().filter(a=>a.name.toLowerCase().includes(ql));
  const songs = getSongs().filter(s=>s.title.toLowerCase().includes(ql)||(s.chords||'').toLowerCase().includes(ql));

  const items = [
    ...artists.map(a=>`<div class="result-item" onclick="goArtist('${esc(a.id)}')"><div><strong>${esc(a.name)}</strong> <span style="font-size:.8rem;color:var(--muted)">${esc(a.genre||'')}</span></div><span class="result-tag rt-artist">Artist</span></div>`),
    ...songs.map(s=>{const ar=getArtists().find(a=>a.id===s.artistId);return`<div class="result-item" onclick="goSong('${esc(s.id)}')"><div><strong>${esc(s.title)}</strong> <span style="font-size:.8rem;color:var(--muted)">by ${esc(ar?.name||'?')}</span></div><span class="result-tag rt-song">Song</span></div>`;})
  ];
  document.getElementById('page-search').innerHTML = `
    <div class="search-wrap">
      <div class="search-title">Results for <span>"${esc(q)}"</span></div>
      ${items.length ? items.join('') : '<div style="color:var(--muted);font-family:JetBrains Mono,monospace;font-size:.8rem">No results found.</div>'}
    </div>`;
  setBreadcrumb([{label:`Search: "${q}"`}]);
  showPage('search');
}

// ══════════════════════════════════════════════════════════════
//  ADMIN PANEL
// ══════════════════════════════════════════════════════════════
let adminPanel = 'artists';

document.getElementById('admin-toggle-btn').onclick = () => {
  const btn = document.getElementById('admin-toggle-btn');
  if (activePage === 'admin') {
    btn.classList.remove('active');
    goHome();
  } else {
    btn.classList.add('active');
    renderAdminPanel();
    showPage('admin');
    setBreadcrumb([{label:'Admin'}]);
  }
};

document.getElementById('admin-sidebar').addEventListener('click', e => {
  const item = e.target.closest('[data-panel]');
  if (!item) return;
  adminPanel = item.dataset.panel;
  document.querySelectorAll('.admin-nav-item').forEach(i=>i.classList.remove('active'));
  item.classList.add('active');
  renderAdminContent();
});

function renderAdminPanel() {
  renderAdminContent();
}

function renderAdminContent() {
  const el = document.getElementById('admin-content');
  if (adminPanel === 'artists') el.innerHTML = renderAdminArtists();
  else if (adminPanel === 'songs') el.innerHTML = renderAdminSongs();
  else if (adminPanel === 'settings') el.innerHTML = renderAdminSettings();
  bindAdminEvents();
}

// ── ADMIN: ARTISTS ──
function renderAdminArtists() {
  const artists = getArtists();
  const songs = getSongs();
  const rows = artists.map(a=>{
    const sc = songs.filter(s=>s.artistId===a.id).length;
    return `<tr>
      <td><strong>${esc(a.name)}</strong></td>
      <td><span style="font-family:JetBrains Mono,monospace;font-size:.75rem;color:var(--muted)">${esc(a.genre||'—')}</span></td>
      <td><span style="font-family:JetBrains Mono,monospace;font-size:.75rem">${sc}</span></td>
      <td><div class="actions">
        <button class="btn btn-secondary btn-sm" onclick="editArtist('${esc(a.id)}')">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteArtist('${esc(a.id)}')">Delete</button>
      </div></td>
    </tr>`;
  }).join('');
  return `
    <div class="admin-header">
      <div class="admin-title">Artists</div>
      <button class="btn btn-primary" onclick="addArtist()">+ Add Artist</button>
    </div>
    ${artists.length ? `
    <table class="admin-table">
      <thead><tr><th>Name</th><th>Genre</th><th>Songs</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : '<div class="empty-state">No artists yet. Add your first one!</div>'}`;
}

function addArtist() {
  openModal('Add Artist', artistFormHtml({}), `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveArtistForm()">Save Artist</button>`);
}
function editArtist(id) {
  const a = getArtists().find(x=>x.id===id);
  if (!a) return;
  openModal('Edit Artist', artistFormHtml(a, id), `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveArtistForm('${esc(id)}')">Save Changes</button>`);
}
function artistFormHtml(a, id='') {
  return `
    <div class="form-grid">
      <div class="form-field">
        <label class="form-label">Artist Name *</label>
        <input class="form-input" id="af-name" value="${esc(a.name||'')}" placeholder="e.g. The Beatles">
      </div>
      <div class="form-field">
        <label class="form-label">Genre</label>
        <input class="form-input" id="af-genre" value="${esc(a.genre||'')}" placeholder="e.g. Rock / Pop">
      </div>
    </div>
    <div class="form-grid full">
      <div class="form-field">
        <label class="form-label">Bio / Description</label>
        <textarea class="form-input form-textarea" id="af-bio" placeholder="Short description of the artist…">${esc(a.bio||'')}</textarea>
      </div>
    </div>`;
}
function saveArtistForm(id='') {
  const name = document.getElementById('af-name').value.trim();
  if (!name) { showToast('Artist name is required', 'error'); return; }
  const artists = getArtists();
  const artist = {
    id: id || uid(),
    name,
    genre: document.getElementById('af-genre').value.trim(),
    bio: document.getElementById('af-bio').value.trim(),
  };
  if (id) {
    const i = artists.findIndex(a=>a.id===id);
    if (i>=0) artists[i] = artist;
  } else {
    artists.push(artist);
  }
  saveArtists(artists);
  closeModal();
  renderAdminContent();
  showToast(id ? 'Artist updated!' : 'Artist added!');
}
function deleteArtist(id) {
  if (!confirm('Delete this artist and all their songs?')) return;
  saveArtists(getArtists().filter(a=>a.id!==id));
  saveSongs(getSongs().filter(s=>s.artistId!==id));
  renderAdminContent();
  showToast('Artist deleted.');
}

// ── ADMIN: SONGS ──
function renderAdminSongs() {
  const songs = getSongs();
  const artists = getArtists();
  const rows = songs.map(s=>{
    const ar = artists.find(a=>a.id===s.artistId);
    return `<tr>
      <td><strong>${esc(s.title)}</strong></td>
      <td><span style="font-size:.85rem;color:var(--ink2)">${esc(ar?.name||'?')}</span></td>
      <td><span class="key-badge">${esc(s.key||'?')}</span></td>
      <td><span class="diff-badge diff-${s.difficulty||'easy'}">${s.difficulty||'easy'}</span></td>
      <td><div class="actions">
        <button class="btn btn-secondary btn-sm" onclick="editSong('${esc(s.id)}')">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteSong('${esc(s.id)}')">Delete</button>
      </div></td>
    </tr>`;
  }).join('');
  return `
    <div class="admin-header">
      <div class="admin-title">Songs</div>
      <button class="btn btn-primary" onclick="addSong()">+ Add Song</button>
    </div>
    ${songs.length ? `
    <table class="admin-table">
      <thead><tr><th>Title</th><th>Artist</th><th>Key</th><th>Difficulty</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : '<div class="empty-state">No songs yet. Add your first one!</div>'}`;
}

function addSong() {
  openModal('Add Song', songFormHtml({}), `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveSongForm()">Save Song</button>`);
}
function editSong(id) {
  const s = getSongs().find(x=>x.id===id);
  if (!s) return;
  openModal('Edit Song', songFormHtml(s, id), `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveSongForm('${esc(id)}')">Save Changes</button>`);
}

function songFormHtml(s, id='') {
  const artists = getArtists();
  const artistOpts = artists.map(a=>`<option value="${esc(a.id)}" ${s.artistId===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
  const diffOpts = ['easy','medium','hard'].map(d=>`<option value="${d}" ${(s.difficulty||'easy')===d?'selected':''}>${d}</option>`).join('');
  const keys = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B','Am','Em','Dm','Bm','F#m','Cm'];
  const keyOpts = keys.map(k=>`<option value="${k}" ${(s.key||'C')===k?'selected':''}>${k}</option>`).join('');
  return `
    <div class="form-grid">
      <div class="form-field">
        <label class="form-label">Song Title *</label>
        <input class="form-input" id="sf-title" value="${esc(s.title||'')}" placeholder="e.g. Wonderwall">
      </div>
      <div class="form-field">
        <label class="form-label">Artist *</label>
        <select class="form-select" id="sf-artist">${artists.length?artistOpts:'<option value="">No artists — add one first</option>'}</select>
      </div>
    </div>
    <div class="form-grid">
      <div class="form-field">
        <label class="form-label">Key</label>
        <select class="form-select" id="sf-key">${keyOpts}</select>
      </div>
      <div class="form-field">
        <label class="form-label">Capo (fret)</label>
        <input class="form-input" id="sf-capo" type="number" min="0" max="12" value="${s.capo||0}">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-field">
        <label class="form-label">Difficulty</label>
        <select class="form-select" id="sf-diff">${diffOpts}</select>
      </div>
      <div class="form-field">
        <label class="form-label">Chords Used</label>
        <input class="form-input" id="sf-chords" value="${esc(s.chords||'')}" placeholder="Am,F,C,G (comma-separated)">
      </div>
    </div>
    <div class="form-grid full">
      <div class="form-field">
        <label class="form-label">Lyrics with Chords</label>
        <textarea class="form-input form-textarea tall" id="sf-lyrics" placeholder="Use [VERSE], [CHORUS] etc for sections.&#10;Use [Am]before a word to place a chord above it.&#10;&#10;Example:&#10;[VERSE]&#10;[Am]When you were [F]here before">${esc(s.lyrics||'')}</textarea>
        <div class="form-hint">
          Sections: [VERSE] [CHORUS] [BRIDGE] [INTRO] [OUTRO]<br>
          Chords: [Am]word — places Am above "word"<br>
          Standalone: [Am] [F] [C] — chord with no lyrics below
        </div>
      </div>
    </div>`;
}

function saveSongForm(id='') {
  const title = document.getElementById('sf-title').value.trim();
  const artistId = document.getElementById('sf-artist').value;
  if (!title) { showToast('Song title is required', 'error'); return; }
  if (!artistId) { showToast('Please add an artist first', 'error'); return; }
  const songs = getSongs();
  const song = {
    id: id || uid(),
    title,
    artistId,
    key: document.getElementById('sf-key').value,
    capo: parseInt(document.getElementById('sf-capo').value)||0,
    difficulty: document.getElementById('sf-diff').value,
    chords: document.getElementById('sf-chords').value.trim(),
    lyrics: document.getElementById('sf-lyrics').value,
  };
  if (id) {
    const i = songs.findIndex(s=>s.id===id);
    if (i>=0) songs[i] = song;
  } else {
    songs.push(song);
  }
  saveSongs(songs);
  closeModal();
  renderAdminContent();
  showToast(id ? 'Song updated!' : 'Song added!');
}

function deleteSong(id) {
  if (!confirm('Delete this song?')) return;
  saveSongs(getSongs().filter(s=>s.id!==id));
  renderAdminContent();
  showToast('Song deleted.');
}

// ── ADMIN: SETTINGS ──
function renderAdminSettings() {
  const s = getSettings();
  return `
    <div class="admin-header">
      <div class="admin-title">Settings</div>
    </div>
    <div style="max-width:500px">
      <div class="form-grid full">
        <div class="form-field">
          <label class="form-label">Site Name</label>
          <input class="form-input" id="set-name" value="${esc(s.siteName||'ChordHub')}">
        </div>
        <div class="form-field" style="margin-top:1rem">
          <label class="form-label">Tagline</label>
          <input class="form-input" id="set-tagline" value="${esc(s.tagline||'')}">
        </div>
      </div>
      <div style="margin-top:1.5rem;display:flex;gap:.75rem">
        <button class="btn btn-primary" onclick="saveSettingsForm()">Save Settings</button>
      </div>
      <div style="margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--border)">
        <div style="font-family:JetBrains Mono,monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem">Danger Zone</div>
        <button class="btn btn-danger" onclick="resetAllData()">Reset All Data</button>
        <div style="font-family:JetBrains Mono,monospace;font-size:.65rem;color:var(--muted);margin-top:.5rem">Deletes all artists and songs. Cannot be undone.</div>
      </div>
    </div>`;
}
function saveSettingsForm() {
  saveSettings({
    siteName: document.getElementById('set-name').value.trim() || 'ChordHub',
    tagline: document.getElementById('set-tagline').value.trim(),
  });
  showToast('Settings saved!');
  renderHome(); // Refresh home hero title
}
function resetAllData() {
  if (!confirm('This will delete ALL artists and songs. Are you sure?')) return;
  saveArtists([]);
  saveSongs([]);
  renderAdminContent();
  showToast('All data reset.');
}

function bindAdminEvents() {} // reserved for dynamic bindings

// ══════════════════════════════════════════════════════════════
//  GLOBAL HELPERS
// ══════════════════════════════════════════════════════════════
function goHome() {
  document.getElementById('admin-toggle-btn').classList.remove('active');
  document.getElementById('global-search').value = '';
  renderHome();
  showPage('home');
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
document.getElementById('logo-btn').onclick = goHome;
renderHome();
</script>
</body>
</html>
